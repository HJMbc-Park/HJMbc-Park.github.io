<!doctype html>
<html lang="{{ site.lang | default: 'ko' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="naver-site-verification" content="f8cd811d44eeaeff3671daa0f12121491cca4d46">
  {% seo %}
  {% feed_meta %}
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  {% include schema.html %}
</head>
<body>
  <a class="skip" href="#main">본문 바로가기</a>
  <header class="site-header">
    <div class="wrap header-row">
      <a class="site-title" href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <nav class="site-nav" aria-label="사이트 메뉴">
        <a href="{{ '/' | relative_url }}">전체 글</a>
        <a href="{{ '/about/' | relative_url }}">글쓴이 소개</a>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>{{ site.title }} · {{ site.author.name }} {{ site.author.role }} ({{ site.author.position }})</p>
      <p>이 노트의 글은 일반적인 건강 정보입니다. 개인의 증상은 직접 진찰을 받아 확인하시기 바랍니다.</p>
    </div>
  </footer>
</body>
</html>
