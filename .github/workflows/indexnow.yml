name: IndexNow (Bing)

on:
  workflow_run:
    workflows: ["pages build and deployment"]
    types: [completed]
  workflow_dispatch:
    inputs:
      urls:
        description: "Space-separated URLs to submit manually"
        required: false

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Submit changed posts to IndexNow
        env:
          KEY: 4b5ced2b48939d404a97372e8a1954ce
          HOST: hjmbc-park.github.io
          MANUAL: ${{ github.event.inputs.urls }}
        run: |
          URLS=""
          if [ -n "$MANUAL" ]; then
            URLS="$MANUAL"
          else
            for f in $(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- '_posts/*.md'); do
              slug=$(basename "$f" .md | sed -E 's/^[0-9]{4}-[0-9]{2}-[0-9]{2}-//')
              URLS="$URLS https://$HOST/posts/$slug/"
            done
          fi
          if [ -z "$(echo $URLS | tr -d ' ')" ]; then echo "no post changes"; exit 0; fi
          LIST=$(for u in $URLS; do printf '"%s",' "$u"; done | sed 's/,$//')
          echo "submitting: $URLS"
          curl -sS -o /dev/null -w "IndexNow HTTP %{http_code}\n" -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "{\"host\":\"$HOST\",\"key\":\"$KEY\",\"keyLocation\":\"https://$HOST/$KEY.txt\",\"urlList\":[$LIST]}"
